name: belegium
description: A cross-platform Flutter app for generating Kassenanordnungen from Excel files.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.10.7
  desktop_drop: ^0.4.3
  file_selector: ^1.0.0
  intl: ^0.18.1
  spreadsheet_decoder: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/belegium_icon.png"
  macos:
    generate: true
  windows:
    generate: true
